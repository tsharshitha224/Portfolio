<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Minimalist Clean Badge Background -->
  <rect width="100" height="100" rx="22" fill="#7D263A" />
  
  <!-- Simple Minimalist Monogram: Geometric H and S -->
  <g fill="none" stroke="#F7F3EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- H left stem -->
    <line x1="28" y1="26" x2="28" y2="74" />
    <!-- H crossbar -->
    <line x1="28" y1="50" x2="52" y2="50" />
    <!-- H right stem / connection -->
    <line x1="52" y1="26" x2="52" y2="74" />
    
    <!-- S modern continuous flow -->
    <path d="M 74 34 C 74 26, 56 26, 56 38 C 56 48, 74 52, 74 62 C 74 74, 56 74, 56 66" />
  </g>
</svg>
